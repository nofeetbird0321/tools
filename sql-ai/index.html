<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="使用 DeepSeek AI 格式化 SQL。API Key 只保存在当前浏览器。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.deepseek.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>SQL Formatter · DeepSeek AI 版</title>
  <link rel="stylesheet" href="../sql/tool.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="shell">
    <div class="topbar"><div class="eyebrow">DEEPSEEK / SQL</div><a class="nav" href="../">← 工具箱</a></div>
    <h1>SQL Formatter <span style="color:var(--accent-2)">AI</span></h1>
    <p class="lede">用 DeepSeek 处理复杂 SQL。页面没有后端，API Key 只保存在当前 Chrome 的站点 localStorage。</p>
    <section class="panel">
      <label class="field"><span>DeepSeek API Key</span><input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…"></label>
      <div class="controls"><button id="save-key" type="button">保存到本浏览器</button><button id="clear-key" type="button">删除本地 Key</button><span class="small">不会写入 GitHub；但网页脚本可读取此站点存储。</span></div>
    </section>
    <section class="workspace" aria-label="AI SQL 格式化工作区" style="margin-top:16px">
      <div class="panel">
        <div class="panel-head"><h2>输入 SQL</h2></div>
        <textarea id="input" spellcheck="false" aria-label="SQL 输入">select user_id, count(*) as total from orders where status = 'paid' group by user_id order by total desc;</textarea>
        <div class="controls"><button class="primary" id="format" type="button">AI 格式化</button></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>格式化结果</h2><button id="copy" type="button">复制</button></div>
        <textarea id="output" spellcheck="false" aria-label="SQL 输出" readonly></textarea>
        <p class="status" id="status" role="status">未发送请求。</p>
      </div>
    </section>
    <p class="notice">隐私边界：AI 版会把输入 SQL 发送给 DeepSeek；不要输入生产密码、Token、客户数据或不允许外传的 SQL。需要绝对本地处理时，请使用 Python 本地版。</p>
    <footer><a href="../sql/">切换到 Python 本地版</a></footer>
  </main>
</body>
</html>
