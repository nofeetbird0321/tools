<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>本地工具箱</title>
  <meta name="description" content="只在浏览器本地处理数据的实用工具。">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 20px; background: #0b0f17; color: #f0f6fc; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(760px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: clamp(30px, 6vw, 48px); }
    p { margin: 0 0 32px; color: #8b949e; }
    a { display: block; padding: 22px; border: 1px solid #30363d; border-radius: 12px; background: #111827; color: inherit; text-decoration: none; }
    a:hover { border-color: #58a6ff; }
    strong { display: block; margin-bottom: 6px; font-size: 20px; }
    span { color: #8b949e; }
  </style>
</head>
<body>
  <main>
    <h1>本地工具箱</h1>
    <p>输入内容只在当前浏览器中处理，不上传到服务器。</p>
    <a href="./json/">
      <strong>JSON 编辑器</strong>
      <span>校验、格式化、树形、表格和图形视图</span>
    </a>
    <a href="./sql/" style="margin-top:12px">
      <strong>SQL Formatter · Python 本地版</strong>
      <span>在浏览器内运行 Python 规则，SQL 不离开当前设备</span>
    </a>
    <a href="./sql-ai/" style="margin-top:12px">
      <strong>SQL Formatter · DeepSeek AI 版</strong>
      <span>自定义模型名，使用浏览器本地保存的 API Key</span>
    </a>
  </main>
</body>
</html>
